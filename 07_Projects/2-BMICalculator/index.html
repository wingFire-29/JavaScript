<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body style="background-color: #212121; color: #fff">
    <nav>
        <a href="/" aria-current="page">Home</a>
        <a target="_blank" href="https://www.linkedin.com/in/parag-shrivastavadatascience/">
            My linkedln
        </a>
    </nav>
    <div class="container">
        <h1>BMI Calculator</h1>
        <form>
            <p><label for="height">Height in cm: </label><input type="text" id="height"></p>
            <p><label for="weight">Weight in kg: </label><input type="text" id="weight"></p>
            <br>
            <button type="submit">Calculate</button>
            <div id="results"></div>
            <div id="weight-guide">
                <h3>BMI Weight Guide</h3>
                <p>Underweight = Less than 18.6</p>
                <p>Normal range = 18.6 to 24.9</p>
                <p>Overweight = Greater than 24.9</p>
            </div>
        </form>
    </div>
</body>
 <script src="script.js"></script>
</html>
